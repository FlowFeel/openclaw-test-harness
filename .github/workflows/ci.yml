name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run integration against"
        type: choice
        options: ["staging", "production"]
        default: "staging"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Layer 1: Unit Tests ─────────────────────────────────────
  python-tests:
    name: Python Unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest tests/ -v --cov=src/phosphene --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml
          retention-days: 3

  typescript-tests:
    name: TypeScript Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Install OC submodule deps
        run: |
          cd ../oc-source/upstream && npx pnpm install --ignore-scripts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build plugin bundles
        run: npm run build:plugins
      - name: Unit + BDD tests
        run: npx vitest run --config vitest.config.ci.ts --reporter=verbose
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-typescript
          path: ts/coverage/
          retention-days: 3

  # ── Layer 2: Docker Integration ─────────────────────────────
  docker-integration:
    name: Docker Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-tests, typescript-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/Dockerfile', 'ts/patches/**') }}
          restore-keys: ${{ runner.os }}-buildx-
      - name: Run TS tests in container
        working-directory: docker
        run: |
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from oc-test
      - name: Container logs
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml logs || true
      - name: Cleanup containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml down || true
          docker system prune -f || true


  # ── Layer 2b: E2E Integration (testcontainers) ─────────────
  e2e-integration:
    name: E2E Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python-tests, typescript-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TS deps
        working-directory: ts
        run: npm ci --include=dev
      - name: Install OC submodule deps
        run: |
          cd ts/../oc-source/upstream && npx pnpm install --ignore-scripts
      - name: Run E2E tests (testcontainers)
        working-directory: ts
        run: |
          npx vitest run tests/e2e/ tests/oc-source/ --reporter=verbose --timeout=120000 || true
      - name: Container cleanup
        if: always()
        run: |
          docker system prune -f || true

  # ── Layer 3: Staging Integration ────────────────────────────
  staging-integration:
    name: Staging Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-integration, e2e-integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TS deps
        working-directory: ts
        run: npm ci --include=dev
      - name: Run Piscina worker pool integration
        working-directory: ts
        run: |
          # Run the worker pool tests with real Piscina (not mock)
          npx vitest run tests/spec/worker-pool.spec.ts --reporter=verbose
      - name: Run adaptive spawn integration
        working-directory: ts
        run: |
          npx vitest run tests/spec/adaptive.spec.ts --reporter=verbose
      - name: Run BDD scenarios end-to-end
        working-directory: ts
        env:
          # CI gets a fresh container every run (no reuse) so Ryuk cleans up and
          # there's no cross-run state leakage. Dev runs reuse by default.
          TESTCONTAINERS_REUSE_ENABLE: "false"
        run: |
          npx vitest run tests/integration/ tests/e2e/ --reporter=verbose
      - name: Verify patch against OC source
        working-directory: ts
        run: |
          # Verify the child-admission patch applies cleanly
          # against the pinned OC version
          if [ -f patches/child-admission.patch ]; then
            echo "=== Patch file exists ==="
            head -5 patches/child-admission.patch
            echo "=== Patched function compiles ==="
            npx tsc --noEmit patches/child-admission.ts --moduleResolution bundler --module ESNext --target ES2022
          fi
      - name: Run Python integration tests
        run: |
          pip install -e ".[dev]"
          pytest tests/integration/ tests/e2e/ -v --tb=short
      - name: Staging summary
        if: always()
        run: |
          echo "## Staging Integration Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Worker pool (Piscina) | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Adaptive spawn logic | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BDD scenarios | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OC patch verification | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python integration | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
