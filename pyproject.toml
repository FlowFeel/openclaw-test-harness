[project]
name = "phosphene-oc-harness"
version = "0.1.0"
description = "Test pyramid and patch harness for OpenClaw modifications — containers, abstractions, and conformance tests"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "requests>=2.31",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/phosphene --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene"]
